<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Â· Achados IF</title>
<link rel="stylesheet" href="prints.css">
<style>body{background:#fff;padding:16px 12px 32px}.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}.bloco h2{display:none}.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}.tb{background:#7c3aed}.btn.main{background:#7c3aed}</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Achados IF</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Garrafa azul</strong><div class="muted">achado · bloco B</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Capinha iPhone</strong><div class="muted">perdido</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Chaveiro IF</strong><div class="muted">devolvido</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Caderno PDM</strong><div class="muted">achado · biblioteca</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Fone bluetooth</strong><div class="muted">perdido</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Achados IF</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item"><div><strong>Garrafa azul</strong><div><span class="badge ok">achado</span></div></div><button class="btn main" style="width:auto;padding:6px 10px;margin:0;font-size:0.75rem;">Reclamar</button></div><div class="item"><div><strong>Chaveiro IF</strong><div><span class="badge off">devolvido</span></div></div><button class="btn ghost" style="width:auto;padding:6px 10px;margin:0;font-size:0.75rem;">—</button></div><div class="aviso info">So reclama item com status achado</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
